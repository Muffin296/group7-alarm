<body data-page="dismissMode">

    <a class="back" id="back-link" href="02-alarm-editor.html" aria-label="Back">&lsaquo;</a>
    <h1>Dismiss mode</h1>

  <p class="subtitle">Set how the alarm can be stopped</p>

  <form id="mode-form">
