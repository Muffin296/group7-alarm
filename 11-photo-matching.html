<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alarm G7">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4765D9">
  <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
  <link rel="manifest" href="pwa/manifest.json">
  <title>11 Photo Matching</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="photoMatching">
  <div class="top">
    <a class="back" id="back-link" href="06-alarm-ringing.html" aria-label="Back">&lsaquo;</a>
    <h1>Photo mission</h1>
  </div>
  <p class="subtitle">Photograph the registered target</p>

  <div class="camera" id="camera">
    <div class="photo-icon"></div>
    <p>Live camera preview</p>
  </div>

  <div class="box box-blue">
    <p class="label">Reference photo</p>
    <p><b id="photo-target">-</b></p>
    <img class="preview hidden" id="reference-image" alt="Reference photo">
  </div>

  <form id="photo-form" novalidate>
    <label class="label" for="photo-file">No camera? Take or choose a photo</label>
    <input id="photo-file" type="file" accept="image/*" capture="environment">
    <p class="box box-red hidden" id="form-error" role="alert"></p>
    <button class="btn" type="submit">Capture and verify</button>
  </form>

  <script src="scripts/api.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
